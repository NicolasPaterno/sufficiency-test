services:
  postgres:
    image: postgres:16-alpine
    container_name: furbweb-postgres
    environment:
      POSTGRES_DB: furbweb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d furbweb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/FurbWeb
      dockerfile: Dockerfile
    container_name: furbweb-backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=furbweb;Username=postgres;Password=postgres"
      Jwt__Key: "MinhaChaveSecretaSuperSeguraParaJWTToken2024!@#$$%"
      Jwt__Issuer: "FurbWeb"
      Jwt__Audience: "FurbWeb"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080/FurbWeb/v1"
    container_name: furbweb-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
